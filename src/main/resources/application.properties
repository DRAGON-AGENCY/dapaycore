# アプリケーション基本設定
spring.application.name=dapaycore

# 文字エンコーディング
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Thymeleaf（開発中はキャッシュ無効にしてテンプレート変更を即反映する）
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DB 接続（PostgreSQL 17 / ポート 5432）。環境変数で上書き可能。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dapaycore}
spring.datasource.username=${DB_USERNAME:dapaycore}
spring.datasource.password=${DB_PASSWORD:dapaycore}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate。テーブル定義は schema.sql で管理するため自動 DDL は行わない。
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# テーブル・データ管理は手動実行のため自動実行を無効化。
spring.sql.init.mode=never

# 郵便番号・デジタルアドレス for Biz API
postal.code.api.base-url=https://api-biz.digital-address.jp
postal.code.api.client-id=

# 国税庁 法人番号公表サイト Web-API（https://www.houjin-bangou.nta.go.jp/webapi/）
# 申請済みのアプリケーション ID を記入すること。
nta.corp.api.id=K3DM9uzMQzdsJ

# ネットスターズ StarPay 還元データ CSV リクエスト API。
# ドメイン・企業コード・key はネットスターズから個別に受領する。環境変数で上書き可能。
# 3 項目すべてが設定されるまで、日次取込・手動再取込は接続せずスキップ（ログ出力のみ）する。
netstars.api.domain=${NETSTARS_API_DOMAIN:}
netstars.api.ent-code=${NETSTARS_API_ENT_CODE:}
netstars.api.key=${NETSTARS_API_KEY:}
# 1 ページあたりの取得件数（pagesize）。仕様上の最大値は 1000。
netstars.api.page-size=${NETSTARS_API_PAGE_SIZE:1000}
# 日次取込スケジュール（cron）。既定は毎日 10:00（Asia/Tokyo）。
netstars.import.cron=${NETSTARS_IMPORT_CRON:0 0 10 * * *}
# 受信を STOP してから自動で再開するまでの日数。既定 5 日。
netstars.import.auto-resume-days=${NETSTARS_IMPORT_AUTO_RESUME_DAYS:5}

# マルチパートファイルサイズ上限（書類アップロード対応）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=120MB

# 加盟店申込書類の保存先ディレクトリ。環境変数で上書き可能。
# WAR 再デプロイ時に webapps/ROOT を削除するため、Tomcat の外側のディレクトリを指定すること。
document.storage.base-dir=${DOCUMENT_STORAGE_DIR:C:/work/自社mPOS精算システム/エビデンス}

# メール送信設定（SMTP）。環境変数で上書き可能。
spring.mail.host=${MAIL_HOST:mail1009.onamae.ne.jp}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME:shouei.kuroyanagi@dragonagency.co.jp}
spring.mail.password=${MAIL_PASSWORD:@1skuroyanagi}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL:true}
spring.mail.properties.mail.smtp.ssl.trust=mail1009.onamae.ne.jp

# メール差出人アドレス
mail.from=${MAIL_FROM:noreply@dragonagency.co.jp}
