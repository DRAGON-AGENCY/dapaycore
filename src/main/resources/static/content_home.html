<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>運用管理ポータル ホーム</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</noscript>
<style>
  :root {
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f0f4f9;
    --bg-soft: #e9f1fb;
    --text-primary: #1b2733;
    --text-secondary: #5a6675;
    --text-tertiary: #93a0af;
    --border: rgba(20,45,80,0.10);
    --accent: #1b66b3;
    --accent-dark: #0c447c;
    --shadow-sm: 0 1px 3px rgba(16,40,70,0.07);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.11);
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-lg: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --bg-soft: #14283f;
      --text-primary: #eef2f7;
      --text-secondary: #aeb9c6;
      --text-tertiary: #7a8694;
      --border: rgba(255,255,255,0.10);
      --accent: #3d8ddd;
      --accent-dark: #2269b5;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg-page);
    color: var(--text-primary);
    font-family: system-ui, "Noto Sans JP", sans-serif;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .page { padding: 28px 32px; background: var(--bg-page); min-height: 100vh; }
  .page-title {
    font-size: var(--fs-lg);
    font-weight: 700;
    color: var(--text-primary);
    margin: 0 0 5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .page-title i { font-size: 26px; color: var(--accent); }
  .page-sub {
    font-size: var(--fs-sm);
    color: var(--text-secondary);
    margin: 0 0 30px;
  }

  /* グループ（カテゴリ）ヘッダー */
  .group { margin-bottom: 30px; }
  .group-title {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-secondary);
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 4px 13px 4px 10px;
    margin: 0 0 13px;
  }
  .group-title i { font-size: 14px; color: var(--text-tertiary); }

  /* ショートカットカード */
  .card-row {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
  }
  .shortcut {
    background: var(--bg-surface);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: 18px 18px 16px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 9px;
    transition: box-shadow .18s, border-color .18s, transform .12s;
    text-align: left;
    font-family: inherit;
    color: inherit;
    text-decoration: none;
    border-left: 3px solid transparent;
  }
  .shortcut:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--accent);
    border-left-color: var(--accent);
    transform: translateY(-2px);
  }
  .shortcut-icon {
    width: 42px;
    height: 42px;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .shortcut-icon i { font-size: 22px; }
  .shortcut-title {
    font-size: var(--fs-base);
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.3;
  }
  .shortcut-desc {
    font-size: var(--fs-xs);
    color: var(--text-secondary);
    line-height: 1.5;
    margin: 0;
  }

  /* カテゴリ別アイコン色 */
  .ic-blue  { background: #e8f1fc; }
  .ic-blue i  { color: #1b66b3; }
  .ic-teal  { background: #e6f6f3; }
  .ic-teal i  { color: #1a8a76; }
  .ic-amber { background: #fdf3e3; }
  .ic-amber i { color: #9a6200; }
</style>
</head>
<body>
<div class="page">
  <h1 class="page-title"><i class="ti ti-layout-dashboard" aria-hidden="true"></i>運用管理ポータル ホーム</h1>
  <p class="page-sub">左のメニュー、またはショートカットから機能を選択してください。</p>

  <!-- 管理 -->
  <div class="group">
    <div class="group-title"><i class="ti ti-settings" aria-hidden="true"></i>管理</div>
    <div class="card-row">
      <button type="button" class="shortcut" onclick="selectMenu('member_list.html')">
        <div class="shortcut-icon ic-blue"><i class="ti ti-building-store" aria-hidden="true"></i></div>
        <div class="shortcut-title">会員管理</div>
        <p class="shortcut-desc">加盟店会員の一覧・詳細・登録・更新を行います。</p>
      </button>
      <button type="button" class="shortcut" onclick="selectMenu('operation_fee_list.html')">
        <div class="shortcut-icon ic-blue"><i class="ti ti-percentage" aria-hidden="true"></i></div>
        <div class="shortcut-title">手数料管理</div>
        <p class="shortcut-desc">決済ブランドごとの手数料設定を管理します。</p>
      </button>
      <button type="button" class="shortcut" onclick="selectMenu('employee_list.html')">
        <div class="shortcut-icon ic-blue"><i class="ti ti-users" aria-hidden="true"></i></div>
        <div class="shortcut-title">社員管理</div>
        <p class="shortcut-desc">運用管理システムを利用する社員の管理を行います。</p>
      </button>
    </div>
  </div>

  <!-- 照会 -->
  <div class="group">
    <div class="group-title"><i class="ti ti-search" aria-hidden="true"></i>照会</div>
    <div class="card-row">
      <button type="button" class="shortcut" onclick="selectMenu('member_list.html?dest=settlement')">
        <div class="shortcut-icon ic-teal"><i class="ti ti-report-money" aria-hidden="true"></i></div>
        <div class="shortcut-title">精算情報照会</div>
        <p class="shortcut-desc">加盟店ごとの精算・入金情報を照会します。</p>
      </button>
      <button type="button" class="shortcut" onclick="selectMenu('member_list.html?dest=storeterminal')">
        <div class="shortcut-icon ic-teal"><i class="ti ti-file-search" aria-hidden="true"></i></div>
        <div class="shortcut-title">店舗・端末・加盟店番号情報照会</div>
        <p class="shortcut-desc">店舗・端末・加盟店番号の登録情報を照会します。</p>
      </button>
    </div>
  </div>

  <!-- データ作成 -->
  <div class="group">
    <div class="group-title"><i class="ti ti-database" aria-hidden="true"></i>データ作成</div>
    <div class="card-row">
      <button type="button" class="shortcut" onclick="selectMenu('operation_shop_data_create.html')">
        <div class="shortcut-icon ic-amber"><i class="ti ti-database-cog" aria-hidden="true"></i></div>
        <div class="shortcut-title">店舗・端末・加盟店番号データ登録・更新</div>
        <p class="shortcut-desc">店舗・端末・加盟店番号のデータを登録・更新します。</p>
      </button>
      <button type="button" class="shortcut" onclick="selectMenu('operation_settlement.html')">
        <div class="shortcut-icon ic-amber"><i class="ti ti-file-spreadsheet" aria-hidden="true"></i></div>
        <div class="shortcut-title">精算データ登録</div>
        <p class="shortcut-desc">決済ブランドごとの精算データを取り込み・登録します。</p>
      </button>
      <button type="button" class="shortcut" onclick="selectMenu('operation_transfer.html')">
        <div class="shortcut-icon ic-amber"><i class="ti ti-transfer" aria-hidden="true"></i></div>
        <div class="shortcut-title">振込データ作成</div>
        <p class="shortcut-desc">加盟店への振込データを生成・出力します。</p>
      </button>
    </div>
  </div>
</div>

<script>
  function selectMenu(src) {
    var item = parent.document.querySelector('.menu-sub[data-src="' + src + '"]');
    if (item) {
      item.click();
    }
  }
</script>
</body>
</html>
