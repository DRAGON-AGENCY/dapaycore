<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本パスワード登録｜mPOSなび</title>
<meta name="csrf-token" th:content="${csrfToken}" content="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</noscript>
<style>
  :root {
    --bg-page: #eef2f7; --bg-surface: #ffffff; --bg-secondary: #f4f6fa; --bg-soft: #e9f1fb;
    --text-primary: #1b2733; --text-secondary: #5a6675; --text-tertiary: #93a0af; --text-soft: #0c447c;
    --border: rgba(20,45,80,0.10); --border-strong: rgba(20,45,80,0.20);
    --accent: #1b66b3; --accent-strong: #0c447c; --accent-line: #3d8ddd;
    --ok: #1a9e5c;
    --warn-soft: #fdf3e3; --warn-text: #8a5410; --warn-border: #ecd9b4;
    --err-soft: #fdf0f0; --err-text: #c0392b; --err-border: #f5c6c6;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-lg: 0 24px 60px rgba(12,34,64,0.18);
    --radius-sm: 8px; --radius-md: 11px; --radius-lg: 18px;
    --fs-xs: 14px; --fs-sm: 15px; --fs-base: 16px; --fs-md: 18px; --fs-lg: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0c1016; --bg-surface: #161d27; --bg-secondary: #1e2731; --bg-soft: #14283f;
      --text-primary: #eef2f7; --text-secondary: #aeb9c6; --text-tertiary: #7a8694; --text-soft: #9cc6f2;
      --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
      --accent: #3d8ddd; --accent-strong: #0c447c;
      --warn-soft: #2e2410; --warn-text: #e8b765; --warn-border: #4a3a18;
      --err-soft: #2e1010; --err-text: #f08080; --err-border: #6a2020;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lg: 0 24px 60px rgba(0,0,0,0.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center; padding: 40px 24px;
  }

  .card {
    width: 100%; max-width: 520px;
    background: var(--bg-surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg); border: 0.5px solid var(--border);
    overflow: hidden;
  }

  /* ヘッダー */
  .card-header {
    background: linear-gradient(150deg, #154a86 0%, #0d2c57 48%, #0a1f3e 100%);
    padding: 32px 40px 28px;
    text-align: center;
  }
  .badge {
    width: 54px; height: 54px; border-radius: 15px;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
  }
  .badge i { font-size: 28px; color: #fff; }
  .card-header h1 { margin: 0 0 6px; font-size: var(--fs-md); font-weight: 700; color: #fff; }
  .card-header p { margin: 0; font-size: 13px; color: rgba(255,255,255,0.72); }

  /* フォーム本体 */
  .card-body { padding: 32px 40px 36px; }

  .field { margin-bottom: 20px; }
  .field > label {
    display: block; font-size: 13px; font-weight: 500;
    color: var(--text-secondary); margin-bottom: 7px;
  }
  input[type="text"], input[type="password"] {
    width: 100%; font-family: inherit; font-size: var(--fs-xs);
    color: var(--text-primary); padding: 12px 14px; height: 48px;
    background: var(--bg-surface); border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-tertiary); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,141,221,0.16); }
  input[readonly] { background: var(--bg-secondary); color: var(--text-secondary); cursor: default; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 72px; }
  .pw-toggle {
    position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
    background: none; border: none; font-family: inherit; font-size: 12.5px;
    color: var(--text-secondary); cursor: pointer; padding: 7px 10px;
    border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 4px;
  }
  .pw-toggle:hover { background: var(--bg-secondary); color: var(--accent); }
  .pw-toggle i { font-size: 16px; }

  .hint { font-size: 12px; color: var(--text-tertiary); margin-top: 5px; }

  .btn-submit {
    width: 100%; height: 50px; margin-top: 4px;
    font-family: inherit; font-size: var(--fs-sm); font-weight: 700;
    color: #fff; background: var(--accent); border: none;
    border-radius: var(--radius-sm); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 8px 18px rgba(27,102,179,0.28);
    transition: background .15s, transform .05s, box-shadow .15s;
  }
  .btn-submit:hover { background: var(--accent-strong); box-shadow: 0 10px 22px rgba(12,68,124,0.34); }
  .btn-submit:active { transform: translateY(1px); }
  .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-submit i { font-size: 18px; }

  /* アラート */
  .alert {
    display: none; gap: 11px; border-radius: var(--radius-md);
    padding: 14px 16px; margin-bottom: 20px;
  }
  .alert.show { display: flex; }
  .alert-err { background: var(--err-soft); border: 1px solid var(--err-border); }
  .alert-ok  { background: #ecfaf3; border: 1px solid #a3e0c0; }
  .alert i { font-size: 18px; margin-top: 2px; flex: 0 0 auto; }
  .alert-err i { color: var(--err-text); }
  .alert-ok  i { color: var(--ok); }
  .alert p { margin: 0; font-size: 13.5px; line-height: 1.7; }
  .alert-err p { color: var(--err-text); }
  .alert-ok  p { color: #156c40; }

  .divider { height: 0.5px; background: var(--border); margin: 24px 0; }
  .back-link { text-align: center; font-size: 13px; }
  .back-link a { color: var(--accent); text-decoration: none; }
  .back-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="card">

  <div class="card-header">
    <div class="badge"><i class="ti ti-lock-open"></i></div>
    <h1>本パスワード登録</h1>
    <p>メールに記載のパスワードを入力し、新しいパスワードを設定してください。</p>
  </div>

  <div class="card-body">

    <!-- エラーメッセージ -->
    <div class="alert alert-err" id="alertErr" role="alert">
      <i class="ti ti-alert-circle"></i>
      <p id="alertErrMsg"></p>
    </div>

    <!-- 完了メッセージ -->
    <div class="alert alert-ok" id="alertOk" role="status">
      <i class="ti ti-circle-check"></i>
      <p>本パスワードを登録しました。<br>ログイン画面からログインしてください。</p>
    </div>

    <div id="formArea">
      <div class="field">
        <label for="memberCode">会員コード</label>
        <input type="text" id="memberCode" placeholder="例）MA-2026-00001" autocomplete="username">
      </div>

      <div class="field">
        <label for="tempPassword">本パスワード登録用パスワード</label>
        <div class="pw-wrap">
          <input type="password" id="tempPassword" placeholder="メールに記載のパスワード" autocomplete="current-password">
          <button type="button" class="pw-toggle" data-target="tempPassword">
            <i class="ti ti-eye"></i>表示
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="newPassword">新しいパスワード</label>
        <div class="pw-wrap">
          <input type="password" id="newPassword" placeholder="8文字以上" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="newPassword">
            <i class="ti ti-eye"></i>表示
          </button>
        </div>
        <p class="hint">8文字以上・英字（大文字または小文字）と数字をそれぞれ1文字以上含めてください。</p>
      </div>

      <div class="field">
        <label for="confirmPassword">新しいパスワード（確認）</label>
        <div class="pw-wrap">
          <input type="password" id="confirmPassword" placeholder="もう一度入力" autocomplete="new-password">
          <button type="button" class="pw-toggle" data-target="confirmPassword">
            <i class="ti ti-eye"></i>表示
          </button>
        </div>
      </div>

      <button type="button" class="btn-submit" id="submitBtn">
        <i class="ti ti-lock"></i>本パスワードを登録する
      </button>
    </div>

    <div class="divider"></div>
    <p class="back-link"><a href="/login.html">ログイン画面へ戻る</a></p>

  </div>
</div>

<script>
  // URLパラメータから会員コードを自動入力
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = params.get('code');
    if (code) {
      document.getElementById('memberCode').value = code;
    }
  })();

  // パスワード表示切替
  document.querySelectorAll('.pw-toggle').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      btn.querySelector('i').className = isText ? 'ti ti-eye' : 'ti ti-eye-off';
      btn.childNodes[1].textContent = isText ? '表示' : '非表示';
    });
  });

  // 送信
  document.getElementById('submitBtn').addEventListener('click', function () {
    var btn = this;
    var memberCode = document.getElementById('memberCode').value.trim();
    var tempPassword = document.getElementById('tempPassword').value;
    var newPassword = document.getElementById('newPassword').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    hideAlerts();

    if (!memberCode || !tempPassword || !newPassword || !confirmPassword) {
      showError('すべての項目を入力してください。');
      return;
    }
    if (newPassword !== confirmPassword) {
      showError('新しいパスワードと確認用パスワードが一致しません。');
      return;
    }
    if (!/^(?=.*[a-zA-Z])(?=.*[0-9]).{8,}$/.test(newPassword)) {
      showError('パスワードは8文字以上で、英字と数字をそれぞれ1文字以上含めてください。');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2" style="animation:spin 1s linear infinite;"></i>処理中...';

    var csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    fetch('/api/password-setup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-TOKEN': csrfToken
      },
      body: JSON.stringify({
        memberCode: memberCode,
        tempPassword: tempPassword,
        newPassword: newPassword,
        confirmPassword: confirmPassword
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.success) {
        document.getElementById('formArea').style.display = 'none';
        document.getElementById('alertOk').classList.add('show');
      } else {
        showError(data.errorMessage || '処理に失敗しました。');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-lock"></i>本パスワードを登録する';
      }
    })
    .catch(function () {
      showError('通信エラーが発生しました。時間をおいて再度お試しください。');
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-lock"></i>本パスワードを登録する';
    });
  });

  function showError(msg) {
    var el = document.getElementById('alertErr');
    document.getElementById('alertErrMsg').textContent = msg;
    el.classList.add('show');
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function hideAlerts() {
    document.getElementById('alertErr').classList.remove('show');
    document.getElementById('alertOk').classList.remove('show');
  }
</script>

<style>
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

</body>
</html>
