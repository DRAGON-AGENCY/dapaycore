<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定｜mPOSなび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f4f6fa;
    --bg-soft: #e9f1fb;
    --bg-soft-2: #f3f7fc;
    --text-primary: #1b2733;
    --text-secondary: #5a6675;
    --text-tertiary: #93a0af;
    --text-soft: #0c447c;
    --border: rgba(20,45,80,0.10);
    --border-strong: rgba(20,45,80,0.24);
    --accent: #1b66b3;
    --accent-strong: #0c447c;
    --accent-line: #3d8ddd;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.10);
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --bg-soft: #14283f;
      --bg-soft-2: #16202c;
      --text-primary: #eef2f7;
      --text-secondary: #aeb9c6;
      --text-tertiary: #7a8694;
      --text-soft: #9cc6f2;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.22);
      --accent: #3d8ddd;
      --accent-strong: #0c447c;
      --accent-line: #3d8ddd;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 440px; background: var(--bg-surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 36px 36px 28px; }
  .brand { text-align: center; }
  .brand .badge { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg,var(--accent),var(--accent-strong)); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .brand .badge i { font-size: 28px; color: #fff; }
  .brand h1 { font-size: 20px; font-weight: 700; margin: 0 0 6px; letter-spacing: .02em; }
  .brand .sub { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.7; }
  .divider { height: 0.5px; background: var(--border); margin: 22px 0; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .input-icon { position: relative; }
  .input-icon > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-tertiary); pointer-events: none; }
  input[type="email"] {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--text-primary);
    padding: 11px 12px 11px 40px; height: 46px; background: var(--bg-surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-tertiary); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,141,221,0.16); }
  .btn-primary { width: 100%; height: 48px; margin-top: 6px; font-family: inherit; font-size: 15px; font-weight: 500; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .05s; }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary i { font-size: 18px; }
  .note { display: flex; gap: 9px; background: var(--bg-soft); border-radius: var(--radius-md); padding: 12px 14px; margin-top: 18px; }
  .note i { font-size: 18px; color: var(--accent); flex: 0 0 auto; margin-top: 1px; }
  .note span { font-size: 12.5px; color: var(--text-soft); line-height: 1.7; }
  .back-row { text-align: center; margin-top: 18px; }
  .back-row a { font-size: 13px; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .back-row a:hover { text-decoration: underline; }
  .back-row a i { font-size: 16px; }
  .foot { text-align: center; font-size: 11.5px; color: var(--text-tertiary); margin: 22px 0 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
  <main class="card">
    <h2 class="sr-only">パスワード再設定画面。登録済みのメールアドレスを入力すると、再設定用のリンクが送信されます。</h2>
    <form id="resetForm" novalidate>
      <div class="brand">
        <span class="badge"><i class="ti ti-lock-question" aria-hidden="true"></i></span>
        <h1>パスワード再設定</h1>
        <p class="sub">ご登録のメールアドレスを入力してください。<br>パスワード再設定用のリンクをお送りします。</p>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="email">メールアドレス</label>
        <div class="input-icon">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <input type="email" id="email" placeholder="例: user@example.co.jp" autocomplete="email">
        </div>
      </div>

      <button type="submit" class="btn-primary"><i class="ti ti-send"></i>再設定用リンクを送信</button>

      <div class="note">
        <i class="ti ti-info-circle" aria-hidden="true"></i>
        <span>入力されたメールアドレスが登録されている場合のみ、再設定用のリンクを送信します。数分待っても届かない場合は、迷惑メールフォルダもご確認ください。</span>
      </div>

      <div class="back-row"><a href="login.html"><i class="ti ti-arrow-left"></i>ログイン画面に戻る</a></div>

      <p class="foot">© 2026 Cashless Management System. All rights reserved.</p>
    </form>
  </main>

<script>
  document.getElementById('resetForm').addEventListener('submit', (e) => {
    e.preventDefault();
    // ここで再設定用メール送信APIを呼び出してください。
    alert('再設定用リンクを送信しました。');
  });
</script>
</body>
</html>
