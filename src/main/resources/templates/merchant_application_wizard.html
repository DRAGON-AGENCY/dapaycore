<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>申込・照会ポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</noscript>
<style>
  :root {
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f4f6fa;
    --text-primary: #1b2733;
    --border: rgba(20,45,80,0.10);
    --accent: #1b66b3;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.10);
    --radius-sm: 7px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --text-primary: #eef2f7;
      --border: rgba(255,255,255,0.10);
      --accent: #3d8ddd;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 24px 18px; }
  .shell {
    background: var(--bg-surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; display: flex;
    align-items: stretch; height: calc(100vh - 48px); min-height: 600px;
    box-shadow: var(--shadow-md);
  }

  /* ---------- sidebar ---------- */
  .sidebar { flex: 0 0 200px; background: linear-gradient(180deg,#0c2440 0%,#0a1f38 100%); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar .brand { position: relative; display: flex; align-items: center; gap: 9px; padding: 6px 10px 30px; }
  .sidebar .brand .logo { width: 22px; height: 22px; stroke: #fff; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
  .sidebar .brand span { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: .02em; }
  .sidebar .brand .logout-btn { position: absolute; right: 10px; bottom: 4px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: var(--radius-sm); font-size: 11.5px; color: #aac4e4; text-decoration: none; transition: background .15s, color .15s; }
  .sidebar .brand .logout-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .sidebar .brand .logout-btn i { font-size: 15px; flex: 0 0 auto; }
  .menu-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-sm); color: #aac4e4; font-size: 13px; text-decoration: none; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; transition: background .15s, color .15s; }
  .menu-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .menu-item i { font-size: 18px; }
  .menu-group { font-size: 11px; font-weight: 700; color: #6f8db0; letter-spacing: 0.06em; padding: 15px 10px 6px; display: flex; align-items: center; gap: 8px; }
  .menu-group i { font-size: 15px; }
  .menu-group:first-of-type { padding-top: 4px; }
  .menu-sub { display: flex; align-items: center; gap: 9px; padding: 8px 10px 8px 14px; border-radius: var(--radius-sm); color: #aac4e4; font-size: 12.5px; line-height: 1.4; text-decoration: none; cursor: pointer; border: none; background: none; width: 100%; text-align: left; font-family: inherit; transition: background .15s, color .15s; }
  .menu-sub:hover { background: rgba(255,255,255,0.08); color: #fff; }
  .menu-sub.active { background: var(--accent); color: #fff; font-weight: 500; box-shadow: var(--shadow-sm); }
  .menu-sub i { font-size: 16px; flex: 0 0 auto; }

  /* ---------- content host ---------- */
  .main { flex: 1; min-width: 0; display: flex; }
  .content-frame { flex: 1; width: 100%; height: 100%; border: 0; background: var(--bg-secondary); }

  /* ---------- mobile ---------- */
  .menu-toggle { display: none; }
  .menu-overlay { display: none; }
  @media (max-width: 860px) {
    .wrap { padding: 0; }
    .shell { height: 100vh; min-height: 0; border-radius: 0; border: 0; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 30; width: 240px; flex: none; transform: translateX(-100%); transition: transform .2s; }
    .sidebar.open { transform: translateX(0); }
    .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 20; }
    .menu-overlay.show { display: block; }
    .menu-toggle { position: fixed; top: 12px; left: 12px; z-index: 10; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--bg-surface); color: var(--text-primary); cursor: pointer; box-shadow: var(--shadow-sm); }
  }
</style>
</head>
<body>
<main class="wrap">
  <h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">申込・照会ポータル。左のメニューから機能を選択すると、右側に対象の画面が表示されます。</h2>

  <button type="button" class="menu-toggle" id="menuToggle" aria-label="メニューを開く"><i class="ti ti-menu-2" style="font-size:18px;" aria-hidden="true"></i></button>

  <div class="shell">

    <div class="menu-overlay" id="menuOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18"/></svg>
        <span>申込・照会ポータル</span>
        <a class="logout-btn" href="login.html"><i class="ti ti-logout" aria-hidden="true"></i>ログアウト</a>
      </div>
      <div class="menu-group"><i class="ti ti-file-import" aria-hidden="true"></i>申込・照会</div>
      <a class="menu-sub" data-src="merchant_application_form.html"><i class="ti ti-credit-card" aria-hidden="true"></i>申込登録</a>
      <a class="menu-sub" data-src="settlement_inquiry.html"><i class="ti ti-receipt" aria-hidden="true"></i>売上管理</a>
    </aside>

    <div class="main">
      <iframe class="content-frame" id="contentFrame" src="content_placeholder.html" title="機能表示エリア"></iframe>
    </div>

  </div>
</main>

<script>
  var contentFrame = document.getElementById('contentFrame');
  var menuItems = document.querySelectorAll('.menu-sub[data-src]');

  function selectMenu(item) {
      menuItems.forEach(function (other) {
          other.classList.remove('active');
      });
      item.classList.add('active');
      contentFrame.src = item.getAttribute('data-src');
  }

  menuItems.forEach(function (item) {
      item.addEventListener('click', function () {
          selectMenu(item);
          closeMenu();
      });
  });

  // mobile menu
  var sidebar = document.getElementById('sidebar');
  var overlay = document.getElementById('menuOverlay');
  var toggle = document.getElementById('menuToggle');

  function closeMenu() {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
  }

  toggle.addEventListener('click', function () {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', closeMenu);
</script>
</body>
</html>
