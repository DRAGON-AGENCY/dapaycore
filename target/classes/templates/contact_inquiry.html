<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" th:content="${csrfToken}" content="">
<title>お問い合わせ｜マイポータル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</noscript>
<style>
  :root {
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f4f6fa;
    --bg-soft: #e9f1fb;
    --bg-soft-2: #f3f7fc;
    --text-primary: #1b2733;
    --text-secondary: #5a6675;
    --text-tertiary: #93a0af;
    --border: rgba(20,45,80,0.10);
    --border-strong: rgba(20,45,80,0.24);
    --accent: #0b5fd0;
    --accent-strong: #0c447c;
    --accent-line: #3d8ddd;
    --ok: #2aa583;
    --ok-soft: #e3f4ee;
    --warn: #d8694e;
    --warn-soft: #fdf0dd;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.10);
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --bg-soft: #14283f;
      --bg-soft-2: #16202c;
      --text-primary: #eef2f7;
      --text-secondary: #aeb9c6;
      --text-tertiary: #7a8694;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.22);
      --accent: #3d8ddd;
      --accent-strong: #0c447c;
      --accent-line: #3d8ddd;
      --ok: #36b78f;
      --ok-soft: #16322a;
      --warn: #e0795f;
      --warn-soft: #38290f;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    font-size: var(--fs-base);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 26px 18px 60px; }
  .shell {
    background: var(--bg-surface); border: 0.5px solid var(--border);
    border-radius: var(--radius-lg); overflow: hidden; display: flex;
    align-items: stretch; min-height: 640px; box-shadow: var(--shadow-md);
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { padding: 16px 28px 0; }
  .topbar .titlerow {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .topbar .titlerow .t {
    font-size: var(--fs-sm); font-weight: 700; color: var(--text-primary);
    display: inline-flex; align-items: center;
  }
  .content { padding: 6px 28px 28px; }

  .section-head {
    display: flex; align-items: center; gap: 9px; background: var(--accent);
    color: #ffffff; padding: 13px 16px; border: 0.5px solid var(--accent);
    border-bottom: none; border-radius: var(--radius-md) var(--radius-md) 0 0;
    font-size: var(--fs-base); font-weight: 700;
  }
  .section-head i { font-size: 17px; color: #ffffff; }
  .panel-box {
    border: 0.5px solid var(--border); border-top: none;
    border-radius: 0 0 var(--radius-md) var(--radius-md);
    padding: 18px 18px 20px; margin-bottom: 22px; box-shadow: var(--shadow-sm);
  }

  .frow {
    display: grid; grid-template-columns: 120px 1fr;
    gap: 12px 14px; align-items: start; margin-bottom: 14px;
  }
  .frow:last-child { margin-bottom: 0; }
  .frow > label { font-size: var(--fs-xs); color: var(--text-secondary); padding-top: 8px; }
  .frow > label .req {
    display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 700;
    color: #fff; background: var(--warn); padding: 1px 5px; border-radius: 3px;
    vertical-align: middle; line-height: 1.4;
  }
  .fcontrols { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }

  input[type="text"], select, textarea {
    font-family: inherit; font-size: var(--fs-xs); color: var(--text-primary);
    padding: 8px 11px; background: var(--bg-surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    outline: none; transition: border-color .15s, box-shadow .15s; min-width: 0;
  }
  input[type="text"] { height: 38px; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,141,221,0.16);
  }
  select { height: 38px; }
  textarea { resize: vertical; width: 100%; min-height: 220px; line-height: 1.7; }
  .grow { flex: 1; width: 100%; }

  .btn {
    font-family: inherit; font-size: var(--fs-xs); font-weight: 500;
    padding: 0 16px; height: 38px; border-radius: var(--radius-sm);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid transparent; transition: opacity .15s, background .15s, transform .05s;
  }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn i { font-size: 16px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:not(:disabled):hover { background: var(--accent-strong); }
  .btn-ghost { background: transparent; color: var(--text-secondary); border-color: var(--border-strong); }
  .btn-ghost:hover { background: var(--bg-secondary); }
  .actions-row { display: flex; gap: 10px; margin-top: 16px; }

  .char-count { font-size: 12px; color: var(--text-tertiary); text-align: right; margin-top: 4px; }

  .msg-area {
    display: none; padding: 10px 14px; border-radius: var(--radius-sm);
    font-size: var(--fs-xs); margin-top: 14px; border: 1px solid transparent;
  }
  .msg-area.ok  { background: var(--ok-soft);   color: #1f6a50; border-color: rgba(31,138,109,0.40); }
  .msg-area.err { background: var(--warn-soft);  color: #791f1f; border-color: var(--warn); }

  /* table */
  .table-scroll {
    overflow-x: auto; border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
  }
  table { width: 100%; border-collapse: collapse; font-size: var(--fs-xs); min-width: 680px; }
  thead th {
    background: var(--accent); color: #ffffff; font-weight: 700;
    text-align: left; padding: 11px 12px; white-space: nowrap;
  }
  thead th i { font-size: 14px; vertical-align: -2px; margin-right: 3px; }
  tbody td { padding: 11px 12px; border-bottom: 0.5px solid var(--border); white-space: nowrap; }
  tbody tr:nth-child(even) td { background: var(--bg-soft-2); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--bg-soft); }
  td.subject { max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .badge-status {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
    font-weight: 600; padding: 3px 10px; border-radius: 999px;
    white-space: nowrap; border: 1px solid transparent; line-height: 1.4;
  }
  .badge-status i { font-size: 14px; flex: 0 0 auto; }
  .st-received   { background: var(--bg-soft);      color: var(--accent-strong); border-color: var(--accent-line); }
  .st-inprogress { background: var(--warn-soft);     color: #8a5410;              border-color: var(--warn); }
  .st-answered   { background: var(--ok-soft);       color: #1f6a50;              border-color: rgba(31,138,109,0.40); }
  .st-closed     { background: var(--bg-secondary);  color: var(--text-tertiary); border-color: var(--border-strong); }

  @media (prefers-color-scheme: dark) {
    .st-inprogress { color: #e8b765; }
  }

  @media (max-width: 720px) {
    .content { padding-left: 16px; padding-right: 16px; }
    .frow { grid-template-columns: 1fr; gap: 6px; }
    .frow > label { padding-top: 0; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);">
    お問い合わせ。新規お問い合わせの送信フォームと、過去のお問い合わせ履歴で構成されています。
  </h2>
  <div class="shell">
    <div class="main">

      <div class="topbar">
        <div class="titlerow">
          <span class="t">お問い合わせ</span>
        </div>
      </div>

      <div class="content">

        <!-- 新規お問い合わせ -->
        <div class="section-head">
          <i class="ti ti-message-plus" aria-hidden="true"></i>新規お問い合わせ
        </div>
        <div class="panel-box">

          <div class="frow">
            <label for="category">カテゴリ<span class="req">必須</span></label>
            <div class="fcontrols">
              <select id="category" style="min-width:260px;">
                <option value="">選択してください</option>
                <option value="契約内容について">契約内容について</option>
                <option value="請求・精算について">請求・精算について</option>
                <option value="端末・機器について">端末・機器について</option>
                <option value="セキュリティについて">セキュリティについて</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div class="frow">
            <label for="subject">件名<span class="req">必須</span></label>
            <div class="fcontrols">
              <input type="text" id="subject" class="grow"
                     placeholder="件名を入力してください" maxlength="100">
            </div>
          </div>

          <div class="frow">
            <label for="body">お問い合わせ内容<span class="req">必須</span></label>
            <div class="fcontrols" style="flex-direction:column; align-items:stretch;">
              <textarea id="body"
                        placeholder="お問い合わせ内容を入力してください（1000文字以内）"
                        maxlength="1000"></textarea>
              <div class="char-count"><span id="char-count">0</span> / 1000 文字</div>
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="btn btn-primary" id="btn-submit" disabled>
              <i class="ti ti-send"></i>送信
            </button>
            <button type="button" class="btn btn-ghost" id="btn-clear">
              <i class="ti ti-eraser"></i>入力クリア
            </button>
          </div>
          <div class="msg-area" id="msg-area" role="alert"></div>
        </div>

        <!-- お問い合わせ履歴 -->
        <div class="section-head">
          <i class="ti ti-history" aria-hidden="true"></i>お問い合わせ履歴
        </div>
        <div class="panel-box">
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th><i class="ti ti-hash"></i>受付番号</th>
                  <th><i class="ti ti-clock"></i>受付日時</th>
                  <th><i class="ti ti-tag"></i>カテゴリ</th>
                  <th><i class="ti ti-file-text"></i>件名</th>
                  <th><i class="ti ti-checkbox"></i>ステータス</th>
                  <th><i class="ti ti-refresh"></i>更新日時</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="inq : ${inquiries}">
                  <td th:text="${inq.inquiryNumber}"></td>
                  <td th:text="${#temporals.format(inq.createdAt, 'yyyy/MM/dd HH:mm')}"></td>
                  <td th:text="${inq.category}"></td>
                  <td class="subject" th:text="${inq.subject}"></td>
                  <td>
                    <span class="badge-status st-received"
                          th:if="${inq.status == 'RECEIVED'}">
                      <i class="ti ti-inbox" aria-hidden="true"></i>受付中
                    </span>
                    <span class="badge-status st-inprogress"
                          th:if="${inq.status == 'IN_PROGRESS'}">
                      <i class="ti ti-loader" aria-hidden="true"></i>対応中
                    </span>
                    <span class="badge-status st-answered"
                          th:if="${inq.status == 'ANSWERED'}">
                      <i class="ti ti-circle-check" aria-hidden="true"></i>回答済み
                    </span>
                    <span class="badge-status st-closed"
                          th:if="${inq.status == 'CLOSED'}">
                      <i class="ti ti-circle-off" aria-hidden="true"></i>クローズ
                    </span>
                  </td>
                  <td th:text="${#temporals.format(inq.updatedAt, 'yyyy/MM/dd HH:mm')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(inquiries)}">
                  <td colspan="6"
                      style="text-align:center; color:var(--text-tertiary);
                             padding:32px; font-size:var(--fs-sm);">
                    お問い合わせ履歴がありません。
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>
</main>

<script>
  var csrfToken = document
      .querySelector('meta[name="csrf-token"]').getAttribute('content');

  var categoryEl = document.getElementById('category');
  var subjectEl  = document.getElementById('subject');
  var bodyEl     = document.getElementById('body');
  var charCountEl = document.getElementById('char-count');
  var btnSubmit  = document.getElementById('btn-submit');
  var btnClear   = document.getElementById('btn-clear');
  var msgArea    = document.getElementById('msg-area');

  function updateSubmitState() {
    var ok = categoryEl.value !== ''
          && subjectEl.value.trim() !== ''
          && bodyEl.value.trim() !== '';
    btnSubmit.disabled = !ok;
  }

  function showMessage(text, isError) {
    msgArea.textContent = text;
    msgArea.className = 'msg-area ' + (isError ? 'err' : 'ok');
    msgArea.style.display = 'block';
  }

  bodyEl.addEventListener('input', function () {
    charCountEl.textContent = bodyEl.value.length;
    updateSubmitState();
  });
  categoryEl.addEventListener('change', updateSubmitState);
  subjectEl.addEventListener('input', updateSubmitState);

  btnClear.addEventListener('click', function () {
    categoryEl.value = '';
    subjectEl.value  = '';
    bodyEl.value     = '';
    charCountEl.textContent = '0';
    msgArea.style.display = 'none';
    updateSubmitState();
  });

  btnSubmit.addEventListener('click', function () {
    btnSubmit.disabled = true;
    var payload = {
      category: categoryEl.value,
      subject:  subjectEl.value.trim(),
      body:     bodyEl.value.trim()
    };
    fetch('/contact_inquiry/submit', {
      method:  'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-TOKEN': csrfToken
      },
      body: JSON.stringify(payload)
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.success) {
        showMessage('お問い合わせを受け付けました。担当者よりご連絡いたします。', false);
        categoryEl.value = '';
        subjectEl.value  = '';
        bodyEl.value     = '';
        charCountEl.textContent = '0';
        // 履歴を最新化するためページをリロードする
        setTimeout(function () { location.reload(); }, 1500);
      } else {
        showMessage(data.message || '送信に失敗しました。', true);
        updateSubmitState();
      }
    })
    .catch(function () {
      showMessage('通信エラーが発生しました。しばらくしてから再度お試しください。', true);
      updateSubmitState();
    });
  });
</script>
</body>
</html>
