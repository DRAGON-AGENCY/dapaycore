# アプリケーション基本設定
spring.application.name=dapaycore

# 文字エンコーディング
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Thymeleaf（開発中はキャッシュ無効にしてテンプレート変更を即反映する）
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# DB 接続（PostgreSQL 17 / ポート 5432）。環境変数で上書き可能。
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dapaycore}
spring.datasource.username=${DB_USERNAME:dapaycore}
spring.datasource.password=${DB_PASSWORD:dapaycore}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate。テーブル定義は schema.sql で管理するため自動 DDL は行わない。
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo

# 起動のたびに schema.sql / data.sql を実行する（CREATE TABLE IF NOT EXISTS で冪等）。
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
