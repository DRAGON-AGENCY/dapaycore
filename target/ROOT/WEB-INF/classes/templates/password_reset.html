<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>パスワード再設定｜mPOSなび</title>
<meta name="csrf-token" th:content="${csrfToken}" content="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"
      media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
</noscript>
<style>
  :root {
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f4f6fa;
    --bg-soft: #e9f1fb;
    --bg-soft-2: #f3f7fc;
    --text-primary: #1b2733;
    --text-secondary: #5a6675;
    --text-tertiary: #93a0af;
    --text-soft: #0c447c;
    --border: rgba(20,45,80,0.10);
    --border-strong: rgba(20,45,80,0.24);
    --accent: #0b5fd0;
    --accent-strong: #0c447c;
    --accent-line: #3d8ddd;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.10);
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --fs-xs: 14px;
    --fs-sm: 15px;
    --fs-base: 16px;
    --fs-md: 18px;
    --fs-lg: 22px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --bg-soft: #14283f;
      --bg-soft-2: #16202c;
      --text-primary: #eef2f7;
      --text-secondary: #aeb9c6;
      --text-tertiary: #7a8694;
      --text-soft: #9cc6f2;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.22);
      --accent: #3d8ddd;
      --accent-strong: #0c447c;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 440px; background: var(--bg-surface);
    border: 0.5px solid var(--border); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md); padding: 36px 36px 28px;
  }
  .brand { text-align: center; }
  .brand .badge {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg,var(--accent),var(--accent-strong));
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm); margin-bottom: 14px;
  }
  .brand .badge i { font-size: 28px; color: #fff; }
  .brand h1 { font-size: var(--fs-md); font-weight: 700; margin: 0 0 6px; letter-spacing: .02em; }
  .brand .sub { font-size: var(--fs-xs); color: var(--text-secondary); margin: 0; line-height: 1.7; }
  .divider { height: 0.5px; background: var(--border); margin: 22px 0; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: var(--fs-xs); font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  .input-icon { position: relative; }
  .input-icon > i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 18px; color: var(--text-tertiary); pointer-events: none; }
  input[type="email"] {
    width: 100%; font-family: inherit; font-size: var(--fs-base); color: var(--text-primary);
    padding: 11px 12px 11px 40px; height: 46px; background: var(--bg-surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-tertiary); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,141,221,0.16); }
  input.input-err { border-color: #dc2626 !important; box-shadow: 0 0 0 3px rgba(220,38,38,0.15) !important; }
  .btn-primary {
    width: 100%; height: 48px; margin-top: 6px; font-family: inherit;
    font-size: var(--fs-sm); font-weight: 700; color: #fff; background: var(--accent);
    border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, transform .05s;
  }
  .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
  .btn-primary:active:not(:disabled) { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-primary i { font-size: 18px; }
  .note {
    display: flex; gap: 9px; background: var(--bg-soft);
    border-radius: var(--radius-md); padding: 12px 14px; margin-top: 18px;
  }
  .note i { font-size: 18px; color: var(--accent); flex: 0 0 auto; margin-top: 1px; }
  .note span { font-size: 12.5px; color: var(--text-soft); line-height: 1.7; }
  .err-msg {
    display: none; align-items: flex-start; gap: 9px;
    background: #fdf0f0; border: 1px solid #f5c6c6; border-radius: var(--radius-md);
    padding: 12px 14px; margin-top: 14px;
  }
  .err-msg.visible { display: flex; }
  .err-msg i { font-size: 17px; color: #c0392b; flex: 0 0 auto; margin-top: 2px; }
  .err-msg span { font-size: 13px; color: #c0392b; line-height: 1.6; }
  .success-panel {
    display: none; text-align: center; padding: 8px 0;
  }
  .success-panel.visible { display: block; }
  .success-panel .ok-icon {
    width: 56px; height: 56px; border-radius: 50%; background: #e6f4ea;
    display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;
  }
  .success-panel .ok-icon i { font-size: 30px; color: #2e7d32; }
  .success-panel h2 { font-size: var(--fs-md); font-weight: 700; margin: 0 0 8px; }
  .success-panel p { font-size: var(--fs-xs); color: var(--text-secondary); margin: 0 0 20px; line-height: 1.7; }
  .back-row { text-align: center; margin-top: 18px; }
  .back-row a {
    font-size: var(--fs-xs); color: var(--accent); text-decoration: none;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .back-row a:hover { text-decoration: underline; }
  .back-row a i { font-size: 16px; }
  .foot { text-align: center; font-size: 11.5px; color: var(--text-tertiary); margin: 22px 0 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .icon-spin { display: inline-block; animation: spin .8s linear infinite; }
</style>
</head>
<body>
  <main class="card" role="main">
    <h2 class="sr-only">パスワード再設定画面</h2>

    <!-- 入力フォーム -->
    <div id="resetForm">
      <div class="brand">
        <span class="badge"><i class="ti ti-lock-question" aria-hidden="true"></i></span>
        <h1>パスワード再設定</h1>
        <p class="sub">ご登録のメールアドレスを入力してください。<br>新しい仮パスワードをお送りします。</p>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="email">メールアドレス</label>
        <div class="input-icon">
          <i class="ti ti-mail" aria-hidden="true"></i>
          <input type="email" id="email" placeholder="例）mail@example.co.jp" autocomplete="email">
        </div>
      </div>

      <button type="button" id="submitBtn" class="btn-primary">
        <i class="ti ti-send" aria-hidden="true"></i>仮パスワードを送信
      </button>

      <div class="err-msg" id="errMsg" role="alert">
        <i class="ti ti-alert-circle" aria-hidden="true"></i>
        <span id="errText">メールアドレスを入力してください。</span>
      </div>

      <div class="note">
        <i class="ti ti-info-circle" aria-hidden="true"></i>
        <span>入力されたメールアドレスが登録されている場合のみ、新しい仮パスワードを送信します。数分待っても届かない場合は、迷惑メールフォルダもご確認ください。</span>
      </div>

      <div class="back-row"><a href="/login.html"><i class="ti ti-arrow-left"></i>ログイン画面に戻る</a></div>

      <p class="foot">© DRAGON AGENCY Co., Ltd. All rights reserved.</p>
    </div>

    <!-- 送信完了パネル -->
    <div id="successPanel" class="success-panel" role="status">
      <div class="ok-icon"><i class="ti ti-mail-check" aria-hidden="true"></i></div>
      <h2>送信しました</h2>
      <p>ご登録のメールアドレスに<br>新しい仮パスワードをお送りしました。<br>メールをご確認のうえ、ログインしてください。</p>
      <a href="/login.html" class="btn-primary" style="text-decoration:none;">
        <i class="ti ti-login" aria-hidden="true"></i>ログイン画面へ
      </a>
    </div>

  </main>

<script>
  (function() {
    var csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    var submitBtn = document.getElementById('submitBtn');
    var emailInput = document.getElementById('email');
    var errMsg = document.getElementById('errMsg');
    var errText = document.getElementById('errText');
    var resetForm = document.getElementById('resetForm');
    var successPanel = document.getElementById('successPanel');

    function showError(msg) {
      errText.textContent = msg;
      errMsg.classList.add('visible');
      emailInput.classList.add('input-err');
    }

    function clearError() {
      errMsg.classList.remove('visible');
      emailInput.classList.remove('input-err');
    }

    emailInput.addEventListener('input', clearError);

    submitBtn.addEventListener('click', function() {
      var email = emailInput.value.trim();
      if (!email) {
        showError('メールアドレスを入力してください。');
        emailInput.focus();
        return;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showError('正しいメールアドレスの形式で入力してください。');
        emailInput.focus();
        return;
      }
      clearError();
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="ti ti-loader-2 icon-spin" aria-hidden="true"></i>送信中...';

      fetch('/api/password-reset', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-TOKEN': csrfToken
        },
        body: JSON.stringify({ email: email })
      })
      .then(function(res) {
        return res.json().then(function(data) {
          return { ok: res.ok, data: data };
        });
      })
      .then(function(result) {
        if (result.ok && result.data.success) {
          resetForm.style.display = 'none';
          successPanel.classList.add('visible');
        } else {
          showError(result.data.errorMessage || '送信に失敗しました。時間をおいて再度お試しください。');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="ti ti-send" aria-hidden="true"></i>仮パスワードを送信';
        }
      })
      .catch(function() {
        showError('送信に失敗しました。時間をおいて再度お試しください。');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="ti ti-send" aria-hidden="true"></i>仮パスワードを送信';
      });
    });

    emailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') submitBtn.click();
    });
  })();
</script>
</body>
</html>
