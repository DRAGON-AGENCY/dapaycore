<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- CSRF トークン。ログイン要求のヘッダーに設定して送信する。 -->
<meta name="csrf-token" th:content="${csrfToken}" content="">
<title>運用管理 ログイン｜mPOSなび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<style>
  :root {
    --bg-page: #eef2f7;
    --bg-surface: #ffffff;
    --bg-secondary: #f4f6fa;
    --bg-soft: #e9f1fb;
    --bg-soft-2: #f3f7fc;
    --text-primary: #1b2733;
    --text-secondary: #5a6675;
    --text-tertiary: #93a0af;
    --text-soft: #0c447c;
    --border: rgba(20,45,80,0.10);
    --border-strong: rgba(20,45,80,0.24);
    --accent: #0b5fd0;
    --accent-strong: #0c447c;
    --accent-line: #3d8ddd;
    --warn-soft: #fdf0dd;
    --warn-text: #8a5410;
    --shadow-sm: 0 1px 2px rgba(16,40,70,0.06);
    --shadow-md: 0 6px 22px rgba(16,40,70,0.10);
    --radius-sm: 7px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-page: #0f141a;
      --bg-surface: #19202a;
      --bg-secondary: #1f2832;
      --bg-soft: #14283f;
      --bg-soft-2: #16202c;
      --text-primary: #eef2f7;
      --text-secondary: #aeb9c6;
      --text-tertiary: #7a8694;
      --text-soft: #9cc6f2;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.22);
      --accent: #3d8ddd;
      --accent-strong: #0c447c;
      --accent-line: #3d8ddd;
      --warn-soft: #38290f;
      --warn-text: #e8b765;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-md: 0 8px 26px rgba(0,0,0,0.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-page); color: var(--text-primary);
    font-family: "Noto Sans JP", system-ui, sans-serif; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card { width: 100%; max-width: 440px; background: var(--bg-surface); border: 0.5px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: 36px 36px 28px; }
  .brand { text-align: center; }
  .brand .badge { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg,var(--accent),var(--accent-strong)); display: inline-flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); margin-bottom: 14px; }
  .brand .badge i { font-size: 28px; color: #fff; }
  .brand h1 { font-size: 22px; font-weight: 700; margin: 0 0 2px; letter-spacing: .02em; }
  .brand .sub { font-size: 12px; color: var(--text-tertiary); margin: 0; letter-spacing: .04em; }
  .syschip { display: inline-flex; align-items: center; gap: 6px; margin-top: 12px; padding: 5px 14px; border-radius: 999px; background: var(--bg-soft); color: var(--text-soft); font-size: 12.5px; font-weight: 700; }
  .syschip i { font-size: 15px; }
  .switch { text-align: center; margin: 16px 0 0; }
  .switch a { font-size: 12.5px; color: var(--accent); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
  .switch a:hover { text-decoration: underline; }
  .switch i { font-size: 15px; }
  .divider { height: 0.5px; background: var(--border); margin: 22px 0; }
  .field { margin-bottom: 16px; }
  .field > label { display: block; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-bottom: 6px; }
  input[type="text"], input[type="password"] {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--text-primary);
    padding: 11px 12px; height: 46px; background: var(--bg-surface);
    border: 1px solid var(--border-strong); border-radius: var(--radius-sm); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--text-tertiary); }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,141,221,0.16); }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 64px; }
  .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; font-family: inherit; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; gap: 4px; }
  .pw-toggle:hover { background: var(--bg-secondary); color: var(--accent); }
  .pw-toggle i { font-size: 16px; }
  .forgot { text-align: right; margin-top: 8px; }
  .forgot a { font-size: 12.5px; color: var(--accent); text-decoration: none; }
  .forgot a:hover { text-decoration: underline; }
  .btn-login { width: 100%; height: 48px; margin-top: 6px; font-family: inherit; font-size: 15px; font-weight: 500; color: #fff; background: var(--accent); border: 1px solid var(--accent); border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .05s; }
  .btn-login:hover { background: var(--accent-strong); }
  .btn-login:active { transform: scale(0.99); }
  .btn-login i { font-size: 18px; }
  .notice { display: flex; gap: 10px; background: var(--warn-soft); border-radius: var(--radius-md); padding: 13px 15px; margin-top: 22px; }
  .notice .ico { flex: 0 0 auto; margin-top: 1px; }
  .notice .ico i { font-size: 18px; color: var(--warn-text); }
  .notice .body .t { font-size: 13px; font-weight: 700; color: var(--warn-text); margin: 0 0 4px; }
  .notice .body .d { font-size: 12.5px; color: var(--warn-text); margin: 0; line-height: 1.7; opacity: 0.95; }
  .foot { text-align: center; font-size: 11.5px; color: var(--text-tertiary); margin: 22px 0 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
</style>
</head>
<body>
  <main class="card">
    <h2 class="sr-only">運用管理システムのログイン画面。社員番号とパスワードを入力してログインします。</h2>
    <form id="loginForm" novalidate>
      <div class="brand">
        <span class="badge"><i class="ti ti-settings-cog" aria-hidden="true"></i></span>
        <h1>mPOSなび</h1>
        <p class="sub">Cashless Management System</p>
        <span class="syschip"><i class="ti ti-settings-cog" aria-hidden="true"></i>運用管理</span>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label for="employeeNumber">社員番号</label>
        <input type="text" id="employeeNumber" placeholder="例: user001" autocomplete="username">
      </div>

      <div class="field">
        <label for="password">パスワード</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="パスワードを入力" autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="パスワードを表示"><i class="ti ti-eye"></i>表示</button>
        </div>
        <div class="forgot"><a href="password_reset.html">パスワードを忘れた場合</a></div>
      </div>

      <div id="login-error" role="alert"
           style="display:none; margin:0 0 14px; padding:10px 14px;
                  border-radius:7px; background:#fbeaea;
                  border:1px solid #f0c4c4; color:#c64a4a; font-size:13px;"></div>

      <button type="submit" class="btn-login"><i class="ti ti-lock"></i>ログイン</button>

      <div class="notice">
        <span class="ico"><i class="ti ti-alert-circle" aria-hidden="true"></i></span>
        <div class="body">
          <p class="t">ログイン時のご注意</p>
          <p class="d">パスワードを連続して5回間違えた場合、アカウントが一時的にロックされます。</p>
        </div>
      </div>

      <div class="switch"><a href="login.html"><i class="ti ti-file-import" aria-hidden="true"></i>申込・照会のログインはこちら</a></div>

      <p class="foot">© 2026 Cashless Management System. All rights reserved.</p>
    </form>
  </main>

<script>
  if (window.self !== window.top) {
    window.top.location.replace(window.location.href);
  }

  const pw = document.getElementById('password');
  const toggle = document.getElementById('pwToggle');
  toggle.addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    toggle.innerHTML = show ? '<i class="ti ti-eye-off"></i>非表示' : '<i class="ti ti-eye"></i>表示';
    toggle.setAttribute('aria-label', show ? 'パスワードを非表示' : 'パスワードを表示');
  });

  // CSRF トークン。ログイン要求のヘッダーに設定して送信する。
  const csrfToken = document
      .querySelector('meta[name="csrf-token"]').getAttribute('content');

  const loginForm = document.getElementById('loginForm');
  const loginButton = loginForm.querySelector('.btn-login');
  const loginError = document.getElementById('login-error');
  const employeeNumberInput = document.getElementById('employeeNumber');

  function showLoginError(message) {
    loginError.textContent = message;
    loginError.style.display = 'block';
  }

  function hideLoginError() {
    loginError.style.display = 'none';
  }

  // 社員番号の入力チェック。問題があればメッセージを返す (問題なければ null)。
  // 半角のみ許可し、空白 (前後・途中) は許可しない。
  function validateEmployeeNumber(value) {
    if (value === '') {
      return '社員番号を入力してください';
    }
    if (/\s/.test(value)) {
      return '空白は使用できません';
    }
    if (!/^[\x21-\x7E]+$/.test(value)) {
      return '半角で入力してください';
    }
    return null;
  }

  // パスワードの入力チェック。問題があればメッセージを返す (問題なければ null)。
  // 前後の空白は許可せず、8～20文字であることを必須とする。
  function validatePassword(value) {
    if (value === '') {
      return 'パスワードを入力してください';
    }
    if (value !== value.trim()) {
      return '前後の空白は使用できません';
    }
    if (value.length < 8 || value.length > 20) {
      return 'パスワードは8～20文字で入力してください';
    }
    return null;
  }

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    hideLoginError();

    const employeeNumber = employeeNumberInput.value;
    const password = pw.value;

    const employeeNumberMessage = validateEmployeeNumber(employeeNumber);
    if (employeeNumberMessage !== null) {
      showLoginError(employeeNumberMessage);
      employeeNumberInput.focus();
      return;
    }
    const passwordMessage = validatePassword(password);
    if (passwordMessage !== null) {
      showLoginError(passwordMessage);
      pw.focus();
      return;
    }

    loginButton.disabled = true;
    fetch('/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-TOKEN': csrfToken
      },
      body: JSON.stringify({
        employeeNumber: employeeNumber,
        password: password
      })
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.success) {
          window.location.href = 'operation_management_portal.html';
          return;
        }
        showLoginError(data.message);
        loginButton.disabled = false;
      })
      .catch(() => {
        showLoginError('通信エラーが発生しました。時間をおいて再度お試しください。');
        loginButton.disabled = false;
      });
  });
</script>
</body>
</html>
